networks:
  biz-net:
    external: true

services:
  26-ollama-prompt-autowrite:
    build: .
    container_name: 26-ollama-prompt-autowrite
    # 显式指定启动命令：传入 entrypoint.sh 后会执行 python -u main.py
    # 必须显式指定，否则 ENTRYPOINT 模式下 $@ 为空会导致容器立即退出并循环重启
    command: ["python", "-u", "main.py"]
    networks:
      - biz-net
    volumes:
      # 输入：待处理文章
      - ./files/26-ollama-prompt-autowrite/00_new:/app/new
      # 已处理原文备份
      - ./files/26-ollama-prompt-autowrite/01_old:/app/old
      # 改写后输出
      - ./files/26-ollama-prompt-autowrite/02_output:/app/output
      # 日志和锁文件
      - ./logs/26-ollama-prompt-autowrite:/app/logs
      # 配置文件（只读挂载敏感信息）
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      # 默认值：局域网 Ollama IP（与 .env 中保持一致）
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-192.168.2.111}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - AGNES_API_KEY=${AGNES_API_KEY:-}
    # 兜底：让 host.docker.internal 解析为宿主机 IP（兼容 Docker Desktop 场景）
    # 局域网部署以 OLLAMA_HOST=192.168.2.111 为主
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1G"
    restart: always
