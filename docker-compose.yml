networks:
  biz-net:
    external: true

services:
  26-ollama-prompt-autowrite:
    build: .
    container_name: 26-ollama-prompt-autowrite
    networks:
      - biz-net
    volumes:
      # 输入：待处理文章
      - ./files/26-ollama-prompt-autowrite/00_new:/app/new
      # 已处理原文备份
      - ./files/26-ollama-prompt-autowrite/01_old:/app/old
      # 改写后输出
      - ./files/26-ollama-prompt-autowrite/02_output:/app/output
      # 日志和锁文件
      - ./logs/26-ollama-prompt-autowrite:/app/logs
      # 配置文件（只读挂载敏感信息）
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - AGNES_API_KEY=${AGNES_API_KEY:-}
    # 访问宿主机的 Ollama 服务（Linux 容器通过 host-gateway 支持 host.docker.internal）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1G"
    restart: always
